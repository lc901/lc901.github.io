<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC901 - Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: url('assets/icons/index.jpg') center/cover no-repeat fixed;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      transition: background 0.5s, color 0.5s;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(6, 6, 12, 0.55);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      z-index: -1;
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .bg-orbs::before, .bg-orbs::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
    }

    .bg-orbs::before {
      width: 600px; height: 600px;
      top: -10%; left: -5%;
      background: radial-gradient(circle, rgba(0, 100, 220, 0.22), rgba(0, 60, 180, 0.1), transparent 70%);
      animation: orbFloat1 15s ease-in-out infinite alternate;
    }

    .bg-orbs::after {
      width: 500px; height: 500px;
      bottom: -10%; right: -5%;
      background: radial-gradient(circle, rgba(0, 120, 240, 0.18), rgba(0, 80, 200, 0.08), transparent 70%);
      animation: orbFloat2 18s ease-in-out infinite alternate;
    }

    @keyframes orbFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8%, 12%) scale(1.15); }
    }

    @keyframes orbFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-10%, -8%) scale(1.1); }
    }

    /* ===== 超透亮液体玻璃 ===== */
    .glass {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
    }

    /* ===== DuangDuang 点击回弹 - 松开就duang ===== */
    @keyframes duangBounce {
      0%   { transform: scale(0.95, 1.05) translateY(1px); }
      25%  { transform: scale(1.04, 0.96) translateY(-3px); }
      50%  { transform: scale(0.98, 1.02) translateY(1px); }
      75%  { transform: scale(1.01, 0.99) translateY(-1px); }
      100% { transform: scale(1) translateY(0); }
    }

    .duang-click {
      transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      will-change: transform;
    }

    .duang-click:hover {
      transform: translateY(-3px);
    }

    .duang-click.duang-pressed {
      transform: scale(0.95, 1.05) translateY(1px);
    }

    .duang-click.duang-anim {
      animation: duangBounce 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* 水珠涟漪 */
    .water-drop {
      position: relative;
      overflow: hidden;
    }

    .water-drop::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 100, 220, 0.15), transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
    }

    .water-drop:active::after {
      animation: waterRipple 0.6s ease-out;
    }

    @keyframes waterRipple {
      0% { width: 0; height: 0; opacity: 0.5; }
      60% { opacity: 0.15; }
      100% { width: 350px; height: 350px; opacity: 0; }
    }

    .container {
      text-align: center;
      padding: 2rem 2rem 6rem;
      max-width: 700px;
      width: 100%;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -2px;
      text-shadow: 0 0 60px rgba(0, 100, 220, 0.25);
    }

    .logo span {
      background: linear-gradient(135deg, #0077dd, #0099ff, #0066cc);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: logoShimmer 4s ease-in-out infinite;
    }

    @keyframes logoShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .tagline {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 3rem;
      font-weight: 400;
    }

    /* 搜索框 */
    .search-container {
      position: relative;
      max-width: 560px;
      margin: 0 auto 3rem;
      z-index: 1;
    }

    .search-box {
      width: 100%;
      padding: 1.15rem 1.5rem 1.15rem 3.5rem;
      font-size: 1.05rem;
      border-radius: 28px;
      color: #e0e0e0;
      outline: none;
      font-family: inherit;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.02) 40%,
        rgba(255, 255, 255, 0.05) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-left: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset -1px -1px 0 rgba(0, 0, 0, 0.05);
    }

    .search-box:focus {
      border-color: rgba(0, 100, 220, 0.5);
      box-shadow:
        0 0 0 4px rgba(0, 100, 220, 0.1),
        0 8px 32px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 60px rgba(0, 100, 220, 0.08);
    }

    .search-box::placeholder { color: rgba(255, 255, 255, 0.25); }

    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      transition: color 0.3s;
    }

    .search-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .search-box:focus ~ .search-icon { color: #0088dd; }

    /* 链接卡片 */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.3rem 1.5rem;
      border-radius: 28px;
      text-decoration: none;
      color: #ccc;
      position: relative;
      overflow: hidden;
      background: transparent;
      border: none;
      box-shadow: none;
      transition: transform 0.3s ease;
      backdrop-filter: blur(0.5px) contrast(1.1) brightness(1.05);
      -webkit-backdrop-filter: blur(0.5px) contrast(1.1) brightness(1.05);
    }

    /* 顶部高光 - 对齐液态玻璃光源(左上角) */
    .link-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      border-radius: 28px 28px 50% 50%;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.18) 0%,
        rgba(255,255,255,0.08) 30%,
        transparent 60%
      );
      pointer-events: none;
    }

    /* 左上角光斑 - 对齐液态玻璃光源(左上角) */
    .link-card::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -40%;
      width: 70%;
      height: 90%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at 30% 30%,
        rgba(255,255,255,0.15) 0%,
        rgba(255,255,255,0.06) 40%,
        transparent 70%
      );
      pointer-events: none;
    }

    /* 悬浮增强 */
    .link-card:hover {
      transform: translateY(-2px);
    }

    .link-card:hover::before {
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.25) 0%,
        rgba(255,255,255,0.12) 30%,
        transparent 60%
      );
    }

    .link-card:hover::after {
      background: radial-gradient(
        ellipse at 30% 30%,
        rgba(255,255,255,0.22) 0%,
        rgba(255,255,255,0.1) 40%,
        transparent 70%
      );
    }

    .link-card .card-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      flex-shrink: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .link-card .card-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #0088dd;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .link-card .card-text { text-align: left; }

    .link-card .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
    }

    .link-card .card-desc {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 3px;
      display: block;
    }

    /* 底部 */
    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.2);
      z-index: 1;
    }

    /* 搜索结果 */
    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0; right: 0;
      border-radius: 16px;
      display: none;
      z-index: 99999;
      background: rgba(15, 15, 25, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-height: 400px;
      overflow-y: auto;
    }

    .search-results.active { display: block; }

    .search-result-item {
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-size: 0.92rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      min-height: 3rem;
    }

    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: rgba(0, 100, 220, 0.08); color: #fff; }

    .search-result-item svg {
      width: 16px; height: 16px;
      fill: none; stroke: #0088dd; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
      opacity: 0.6; flex-shrink: 0;
    }

    /* 为什么选我们按钮 */
    .why-btn {
      position: fixed;
      top: 1.5rem;
      right: 15rem;
      z-index: 102;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      overflow: hidden;
    }

    .why-btn:hover {
      border-color: rgba(0, 100, 220, 0.35);
      color: #fff;
    }

    .why-btn:active {
      transform: scale(0.96);
    }

    /* 脉冲动画 */
    @keyframes whyPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), 0 2px 8px rgba(0, 0, 0, 0.15); }
      50% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), 0 2px 8px rgba(0, 0, 0, 0.2), 0 0 15px rgba(0, 100, 220, 0.15); }
    }

    .why-btn.pulse {
      animation: whyPulse 2s ease-in-out infinite;
    }

    /* 语言下拉菜单 */
    .lang-dropdown {
      position: fixed;
      top: 1.5rem; right: 9rem;
      z-index: 100;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
    }

    .lang-btn {
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all 0.25s;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.9);
    }

    .lang-btn:hover {
      border-color: rgba(0, 100, 220, 0.35);
      color: #fff;
    }

    /* Kali菜单内语言切换按钮 */
    .lang-btn-inline {
      display: block;
      width: calc(100% - 2rem);
      margin: 0.5rem 1rem;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-left: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.95);
      transition: all 0.25s;
      text-align: left;
    }

    .lang-btn-inline:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(0, 100, 220, 0.4);
      color: #fff;
    }

    /* Kali菜单内语言下拉菜单 */
    .lang-menu-inline {
      position: relative;
      margin: 0 0.5rem 0.5rem;
      border-radius: 10px;
      display: none;
      min-width: calc(100% - 1rem);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
    }

    .lang-menu-inline.open { display: block; }

    .lang-menu-inline button {
      display: block;
      width: 100%;
      padding: 0.6rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px) saturate(1.5) brightness(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(1.5) brightness(1.1);
      border: none;
      color: rgba(255, 255, 255, 0.5);
      text-align: left;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all 0.15s;
    }

    .lang-menu-inline button:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .lang-menu-inline button.active { background: rgba(0, 100, 220, 0.15); color: #0088dd; }

    /* 右上角语言下拉菜单 */
    .lang-menu-top {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      border-radius: 14px;
      overflow: hidden;
      display: none;
      min-width: 140px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
    }

    .lang-menu-top.open { display: block; }

    .lang-menu-top button {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px) saturate(1.5) brightness(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(1.5) brightness(1.1);
      border: none;
      color: rgba(255, 255, 255, 0.5);
      text-align: left;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all 0.15s;
    }

    .lang-menu-top button:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .lang-menu-top button.active { background: rgba(0, 100, 220, 0.15); color: #0088dd; }

    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      border-radius: 14px;
      overflow: hidden;
      display: none;
      min-width: 140px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.01) 50%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      -webkit-backdrop-filter: blur(40px) saturate(2.0) brightness(1.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        inset 1px 0 0 rgba(255, 255, 255, 0.04);
    }

    .lang-menu.open { display: block; }

    .lang-menu button {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px) saturate(1.5) brightness(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(1.5) brightness(1.1);
      border: none;
      color: rgba(255, 255, 255, 0.5);
      text-align: left;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all 0.15s;
    }

    .lang-menu button:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .lang-menu button.active { background: rgba(0, 100, 220, 0.15); color: #0088dd; }

    /* ===== Kali-style 侧边菜单栏 ===== */
    .kali-sidebar {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 101;
      border-radius: 12px;

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });

    const langMenuTop = document.getElementById('lang-menu-top');

    if (langMenuTop) langMenuTop.addEventListener('click', e => { if (e.target.dataset.lang) setLang(e.target.dataset.lang); });

      { titleKey:'nav_services', descKey:'services_hero_desc', url:'services.html', keywords:['服务','service','cybersecurity','professional'],
        svg:'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' }
    ];

    function rebuildSearch() {
      const query = searchBox.value.trim().toLowerCase();
      if (!query) { searchResults.classList.remove('active'); return; }
      const filtered = pages.filter(p => {
        const title = t(p.titleKey).toLowerCase(), desc = t(p.descKey).toLowerCase();
        const kw = (p.keywords || []).join(' ').toLowerCase();
        return title.includes(query) || desc.includes(query) || kw.includes(query);
      });
      if (filtered.length === 0) {
        searchResults.innerHTML = '<div class="search-result-item"><span style="opacity:0.5;">-</span> 无搜索结果</div>';
      } else {
        searchResults.innerHTML = filtered.map(p =>
          `<a href="${p.url}" class="search-result-item" data-url="${p.url}">${p.svg}<span>${t(p.titleKey)}</span><span style="margin-left:auto;font-size:0.78rem;color:#555;">${t(p.descKey)}</span></a>`
        ).join('');

      searchResults.classList.add('active');

    // 液态玻璃扭曲效果 - 应用到每个卡片
    (function() {
      'use strict';
      
      function smoothStep(a, b, t) {
        t = Math.max(0, Math.min(1, (t - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }
      
      function length(x, y) {
        return Math.sqrt(x * x + y * y);
      }
      
      function roundedRectSDF(x, y, width, height, radius) {
        const qx = Math.abs(x) - width + radius;
        const qy = Math.abs(y) - height + radius;
        return Math.min(Math.max(qx, qy), 0) + length(Math.max(qx, 0), Math.max(qy, 0)) - radius;
      }

      // 共享光源方向 - 固定在左上角,两个卡片折射一致

        const id = 'lg-' + index;
        const w = 400;
        const h = 120;
        
        // 创建SVG滤镜
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', '0');
        svg.setAttribute('height', '0');
        svg.style.position = 'fixed';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '-1';
        
        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.setAttribute('id', id + '_filter');
        filter.setAttribute('filterUnits', 'userSpaceOnUse');
        filter.setAttribute('colorInterpolationFilters', 'sRGB');
        filter.setAttribute('x', '0');
        filter.setAttribute('y', '0');
        filter.setAttribute('width', w.toString());
        filter.setAttribute('height', h.toString());
        
        const feImage = document.createElementNS('http://www.w3.org/2000/svg', 'feImage');
        feImage.setAttribute('id', id + '_map');
        feImage.setAttribute('width', w.toString());
        feImage.setAttribute('height', h.toString());
        
        const feDisplacement = document.createElementNS('http://www.w3.org/2000/svg', 'feDisplacementMap');
        feDisplacement.setAttribute('in', 'SourceGraphic');
        feDisplacement.setAttribute('in2', id + '_map');
        feDisplacement.setAttribute('xChannelSelector', 'R');
        feDisplacement.setAttribute('yChannelSelector', 'G');
        feDisplacement.setAttribute('scale', '30');
        
        filter.appendChild(feImage);
        filter.appendChild(feDisplacement);
        defs.appendChild(filter);
        svg.appendChild(defs);
        document.body.appendChild(svg);
        
        // 创建隐藏canvas生成扭曲贴图
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.style.display = 'none';
        const ctx = canvas.getContext('2d');
        document.body.appendChild(canvas);
        
        // 鼠标位置
        let mouseX = lightSourceX, mouseY = lightSourceY;
        let isOverCard = false;
        
        card.addEventListener('mouseenter', () => { isOverCard = true; });
        card.addEventListener('mouseleave', () => { isOverCard = false; });
        
        document.addEventListener('mousemove', (e) => {
          if (!isOverCard) return;
          const rect = card.getBoundingClientRect();
          mouseX = (e.clientX - rect.left) / rect.width;
          mouseY = (e.clientY - rect.top) / rect.height;
        });
        
        // 生成扭曲贴图
        function updateDisplacement() {
          const imageData = ctx.createImageData(w, h);
          const data = imageData.data;
          
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const uvX = x / w;
              const uvY = y / h;
              
              const ix = uvX - 0.5;
              const iy = uvY - 0.5;
              const dist = roundedRectSDF(ix, iy, 0.45, 0.01, 0.14);
              const disp = smoothStep(0.8, 0, dist - 0.15);
              const scaled = smoothStep(0, 1, disp);
              
              // 基于统一光源方向偏移 - 两个卡片一致
              const mouseOffsetX = (lightSourceX - 0.5) * 0.15 * scaled;
              const mouseOffsetY = (lightSourceY - 0.5) * 0.15 * scaled;
              
              const dx = mouseOffsetX * w;
              const dy = mouseOffsetY * h;
              const maxScale = 10;
              
              const idx = (y * w + x) * 4;
              data[idx] = ((dx / maxScale) + 0.5) * 255;
              data[idx + 1] = ((dy / maxScale) + 0.5) * 255;
              data[idx + 2] = 0;
              data[idx + 3] = 255;
            }
          }
          
          ctx.putImageData(imageData, 0, 0);
          feImage.setAttributeNS('http://www.w3.org/1999/xlink', 'href', canvas.toDataURL());
        }
        
        // 应用SVG滤镜到卡片
        card.style.backdropFilter = `url(#${id}_filter) blur(0.3px)`;
        card.style.webkitBackdropFilter = `url(#${id}_filter) blur(0.3px)`;
        
        // 动画循环
        function animate() {
          updateDisplacement();
          requestAnimationFrame(animate);
        }
        animate();
      });

      // 1.5秒延迟跳转
      document.querySelectorAll('.link-card[data-delay]').forEach(card => {
        card.addEventListener('click', function(e) {
          e.preventDefault();
          const delay = parseInt(this.getAttribute('data-delay')) || 2500;
          setTimeout(() => { window.location.href = this.href; }, delay);
        });
      });
    })();

    // === GSAP Animations ===
    document.addEventListener('DOMContentLoaded', function() {
      // 等待 GSAP 加载完成
      if (typeof gsap === 'undefined') return;

      const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

      // Logo 动画 - 从上方滑入并缩放
      tl.from('.logo', {
        y: -60,
        opacity: 0,
        scale: 0.8,
        duration: 1.2,
        ease: 'back.out(1.7)'
      })
      // Tagline 淡入
      .from('.tagline', {
        opacity: 0,
        y: 20,
        duration: 0.8
      }, '-=0.6')
      // 搜索框动画
      .from('.search-container', {
        opacity: 0,
        y: 30,
        scale: 0.95,
        duration: 0.8
      }, '-=0.4')
      // 链接卡片依次淡入(保持原大小和位置)
      .from('.link-card', {
        opacity: 0,
        duration: 0.7,
        stagger: 0.15,
        ease: 'power2.out'
      }, '-=0.3')
      // 底部 footer 淡入
      .from('.footer', {
        opacity: 0,
        y: 20,
        duration: 0.6
      }, '-=0.3')
      // 主题切换按钮动画
      .from('.theme-toggle-wrapper', {
        opacity: 0,
        x: 50,
        duration: 0.6
      }, '-=0.3')
      // Kali 菜单按钮动画
      .from('.kali-sidebar', {
        opacity: 0,
        x: -50,
        duration: 0.6
      }, '-=0.4')
      // 语言下拉菜单动画
      .from('.lang-dropdown', {
        opacity: 0,
        x: 50,
        duration: 0.6
      }, '-=0.4');

      // 背景光球动画增强
      gsap.to('.bg-orbs::before', {
        opacity: 0.7,
        duration: 3,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });

      // 链接卡片悬停增强动画
      document.querySelectorAll('.link-card').forEach(card => {
        card.addEventListener('mouseenter', function() {
          gsap.to(this, {
            scale: 1.05,
            y: -8,
            duration: 0.3,
            ease: 'power2.out'
          });
        });
        card.addEventListener('mouseleave', function() {
          gsap.to(this, {
            scale: 1,
            y: 0,
            duration: 0.3,
            ease: 'power2.out'
          });
        });
      });

      // Logo 持续微动画
      gsap.to('.logo', {
        textShadow: '0 0 80px rgba(0, 100, 220, 0.4)',
        duration: 2,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });

      // 搜索框聚焦动画
      const searchBox = document.getElementById('searchBox');
      if (searchBox) {
        searchBox.addEventListener('focus', function() {
          gsap.to(this, {
            boxShadow: '0 0 0 4px rgba(0, 100, 220, 0.15), 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 0 80px rgba(0, 100, 220, 0.12)',
            duration: 0.4,
            ease: 'power2.out'
          });
        });
        searchBox.addEventListener('blur', function() {
          gsap.to(this, {
            boxShadow: '',
            duration: 0.3,
            ease: 'power2.out'
          });
        });
      }
    });

    // === Anime.js Animations ===
    if (typeof anime !== 'undefined') {
      // 背景光球浮动动画
      anime({
        targets: '.bg-orbs::before',
        translateX: [
          { value: -30, duration: 4000, easing: 'easeInOutSine' },
          { value: 30, duration: 4000, easing: 'easeInOutSine' }
        ],
        translateY: [
          { value: -20, duration: 5000, easing: 'easeInOutSine' },
          { value: 20, duration: 5000, easing: 'easeInOutSine' }
        ],
        loop: true,
        direction: 'alternate'
      });

      // 链接卡片波浪式入场动画
      anime({
        targets: '.link-card',
        opacity: [0, 1],
        translateY: [40, 0],
        scale: [0.9, 1],
        delay: anime.stagger(150, { start: 800 }),
        duration: 800,
        easing: 'easeOutExpo'
      });

      // 搜索框聚焦脉冲动画
      const searchBox = document.getElementById('searchBox');
      if (searchBox) {
        searchBox.addEventListener('focus', function() {
          anime({
            targets: this,
            boxShadow: [
              '0 0 0 4px rgba(0, 100, 220, 0.1)',
              '0 0 0 8px rgba(0, 100, 220, 0.05)',
              '0 0 0 4px rgba(0, 100, 220, 0.1)'
            ],
            duration: 1500,
            easing: 'easeInOutSine',
            loop: true
          });
        });
        searchBox.addEventListener('blur', function() {
          anime.remove(this);
          this.style.boxShadow = '';
        });
      }

      // Logo 呼吸动画
      anime({
        targets: '.logo',
        textShadow: [
          '0 0 60px rgba(0, 100, 220, 0.25)',
          '0 0 80px rgba(0, 100, 220, 0.4)',
          '0 0 60px rgba(0, 100, 220, 0.25)'
        ],
        duration: 3000,
        easing: 'easeInOutSine',
        loop: true
      });

      // 标签行淡入动画
      anime({
        targets: '.tagline',
        opacity: [0, 0.35],
        translateY: [15, 0],
        delay: 600,
        duration: 800,
        easing: 'easeOutExpo'
      });
    }
  </script>
</body>
</html>
